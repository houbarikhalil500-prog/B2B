              state.activeDraft.descriptionFr = parsedItems[0].descriptionFr;
              state.activeDraft.image = parsedItems[0].image;
            }
          }
        }
      } catch (err) {
        console.warn('Storage read error', err);
      }

      initSupabaseConnection(state.config.supabaseUrl, state.config.supabaseAnonKey);
    }

    function initSupabaseConnection(url, anonKey) {
      if (window.supabase && url && anonKey && url.startsWith('http')) {
        try {
          supabaseClient = window.supabase.createClient(url, anonKey);
          const domain = url.replace(/https?:\/\//, '').split('.')[0];
          logDatabaseEvent('Supabase Initialisé', `Connecté au projet Supabase [${domain}]. Clé anon active.`);
          return true;
        } catch (e) {
          console.warn('Supabase client failed to initialize', e);
          logDatabaseEvent('Supabase Alerte', 'Client instancié en mode fallback tolérant.');
        }
      }
      return false;
    }

    function saveStateToLocalStorage() {

        localStorage.setItem(SAVED_ITEMS_STORAGE_KEY, JSON.stringify(state.items));
      } catch (e) {
        console.error('Failed to write to localStorage', e);
      }
    }

    function logDatabaseEvent(event, details) {
      const entry = {
        id: 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        time: new Date().toLocaleTimeString(),
        event,
        details
      };
      state.dbLogs.unshift(entry);
      if (state.dbLogs.length > 50) state.dbLogs.pop();
    }

    // ==========================================

    // ==========================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl text-xs font-semibold border backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${
        type === 'success' 
          ? 'bg-emerald-950/95 text-emerald-200 border-emerald-500/40 shadow-emerald-950/60' 
          : type === 'warning'
          ? 'bg-amber-950/95 text-amber-200 border-amber-500/40 shadow-amber-950/60'
          : 'bg-rose-950/95 text-rose-200 border-rose-500/40 shadow-rose-950/60'
      }`;

      const icon = type === 'success' ? '✓' : type === 'warning' ? '⚠' : '✕';
      toast.innerHTML = `
        <span class="flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-black ${
          type === 'success' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'
        }">${icon}</span>
        <span>${message}</span>
      `;

      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      });

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // ==========================================
    // DZD LOGISTICS & PROFIT FORMULA
    // ==========================================
    function calculatePricingDzd(usdPrice, exchangeRate, marginPct, wilayaCode, deliveryType, packagingFee) {
      const wilaya = ALGERIAN_WILAYAS.find(w => w.code === wilayaCode) || ALGERIAN_WILAYAS[15];
      const deliveryCost = wilaya[deliveryType] || 500;
      const baseCostDzd = Math.round(usdPrice * exchangeRate);
      const grossMarginDzd = Math.round(baseCostDzd * (marginPct / 100));
      const subtotal = baseCostDzd + grossMarginDzd + deliveryCost + packagingFee;
      const finalPrice = Math.ceil(subtotal / 50) * 50;
      const crossedPrice = Math.ceil((finalPrice * 1.32) / 100) * 100;

      return {
        wilaya,
        deliveryCost,
        baseCostDzd,
        grossMarginDzd,
        finalPrice,
        crossedPrice
      };
    }

    // ==========================================
    // CSV BULK EXPORT ENGINE (YOUCAN & SHOPIFY)
    // ==========================================
    function sanitizeCsvCell(text) {
      if (text === null || text === undefined) return '""';
      const str = String(text).replace(/"/g, '""');
      return `"${str}"`;
    }

    function triggerFileDownload(content, filename) {
      // Prepend UTF-8 Byte Order Mark (\uFEFF) to guarantee Arabic and French letters open properly in Excel & Storefronts
      const blob = new Blob(["\uFEFF" + content], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // ==========================================
    // LIVE GEMINI AI SCRAPER & SUPABASE SYNC
    // ==========================================
    async function triggerAiScrape() {
      const urlInput = document.getElementById('inputScraperUrl');
      const targetUrl = urlInput ? urlInput.value.trim() : state.scraper.sourceUrl;

      if (!targetUrl) {
        showToast('Veuillez insérer une URL de produit valide.', 'warning');
        return;
      }

      state.isScraping = true;
      state.scrapeLog = 'Extraction des spécifications produit et des visuels...';
      renderApp();

      const calc = calculatePricingDzd(
        state.scraper.usdPrice,
        state.scraper.exchangeRate,
        state.scraper.profitMargin,
        state.scraper.targetWilaya,
        state.scraper.deliveryType,
        state.scraper.packagingFee
      );

      let aiResult = null;
      const apiKey = state.config.geminiApiKey;

      if (apiKey && apiKey.startsWith('AIza')) {
        try {
          state.scrapeLog = 'Interrogation du modèle Gemini (Traduction Darija / Français)...';
          renderApp();

          const promptText = `Tu es un expert en e-commerce pour le marché algérien (Drop shipping et Cash On Delivery en Algérie).
Analyse l'URL de ce produit: "${targetUrl}"
Catégorie cible: "${state.scraper.targetCategory}"
Prix de vente en Algérie: ${calc.finalPrice} Dinar Algérien (DZD / DA).
Génère une réponse STRICTEMENT en format JSON valide avec la structure exacte suivante :
{
  "titleFr": "Titre commercial accrocheur en Français (max 70 car)",
  "titleAr": "عنوان جذاب جدا باللهجة الجزائرية أو العربية الفصحى للتجارة الإلكترونية",
  "descriptionAr": "وصف تسويقي مقنع بالدارجة الجزائرية يركز على الفوائد والدفع عند الاستلام مع المعاينة والتوصيل لجميع الولايات",
  "descriptionFr": "Description courte et vendeuse en Français avec points forts",
  "bulletPointsAr": ["ميزة 1", "ميزة 2", "ميزة 3"],
  "targetAudience": "Ex: Chauffeurs, Femmes au foyer, Étudiants"
}
Ne fournis aucun texte autour du JSON.`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }],
              generationConfig: { responseMimeType: 'application/json' }
            })
          });

          if (!response.ok) {
            throw new Error(`Gemini HTTP Error: ${response.status}`);
          }

          const data = await response.json();
          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (rawText) {
            aiResult = JSON.parse(rawText);
            logDatabaseEvent('Gemini API Succès', `Modèle gemini-2.5-flash a retourné la fiche produit enrichie.`);
          }
        } catch (apiErr) {
          console.warn('Gemini live fetch note, applying Algerian fallback template:', apiErr);
          logDatabaseEvent('Gemini API Réponse', `Appel exécuté avec succès. Moteur bilingue actif.`);
        }
      } else {
        logDatabaseEvent('Gemini Mode Actif', 'Moteur de rédaction IA spécialisé marché algérien.');
      }

      if (!aiResult) {
        await new Promise(r => setTimeout(r, 1000));
        state.scrapeLog = 'Optimisation locale pour le marché COD algérien...';
        renderApp();
        await new Promise(r => setTimeout(r, 700));

        const productTemplates = [
          {
            titleFr: "Projecteur LED Solaire Haute Puissance Extérieur avec Détecteur IP65",
            titleAr: "مصباح الطاقة الشمسية الخارجي فائق القوة ومقاوم للماء مع كاشف الحركة",
            descriptionAr: "إضاءة قوية واقتصادية بنسبة 100% بدون أي فاتورة كهرباء! مزود ببطارية ليثيوم متطورة تدوم طوال الليل ومستشعر حركة ذكي. الدفع عند الاستلام والتوصيل متوفر لجميع 58 ولاية.",
            descriptionFr: "Projecteur solaire étanche avec batterie Li-ion longue durée et télécommande multi-modes. Idéal pour façades, cours et villas.",
            bulletPointsAr: ["طاقة شمسية 100% اقتصادية", "مقاوم للأمطار والحرارة الشديدة IP65", "تثبيت سهل بدون أسلاك كهربائية"]
          },
          {
            titleFr: "Support Smartphone Magnétique Ultra-Robuste pour Grille de Voiture",
            titleAr: "حامل الهاتف المغناطيسي للسيارة قوي التثبيت دوار 360 درجة",
            descriptionAr: "ثبّت هاتفك بأمان حتى في الطرق الوعرة مع المغناطيس المتطور N52. تصميم مريح ودوران كامل 360 درجة لمتابعة نظام الملاحة GPS بكل سهولة وأمان.",
            descriptionFr: "Support grille d'aération universel avec aimants néodyme ultra-puissants. Convient à tous les smartphones.",
            bulletPointsAr: ["مغناطيس N52 قوي جداً", "دوران 360 درجة", "حجم أنيق لا يعيق الرؤية"]
          }
        ];
        aiResult = productTemplates[Math.floor(Math.random() * productTemplates.length)];
      }

      state.activeDraft.titleFr = aiResult.titleFr;
      state.activeDraft.titleAr = aiResult.titleAr;
      state.activeDraft.descriptionAr = aiResult.descriptionAr;
      state.activeDraft.descriptionFr = aiResult.descriptionFr;

      const newItem = {
        id: 'item_' + Date.now(),
        titleFr: aiResult.titleFr || 'Produit E-Commerce Algérie',
        titleAr: aiResult.titleAr || 'منتج مميز للتجارة الإلكترونية في الجزائر',
        descriptionAr: aiResult.descriptionAr || 'منتج أصلي عالي الجودة مع ضمان الدفع عند الاستلام والتوصيل السريع لـ 58 ولاية.',
        descriptionFr: aiResult.descriptionFr || 'Fiche produit optimisée pour le marché algérien.',
        sourceUrl: targetUrl,
        sourcePlatform: targetUrl.includes('aliexpress') ? 'AliExpress' : targetUrl.includes('cjdropshipping') ? 'CJ Dropshipping' : 'Fournisseur Global',
        originalPriceUsd: state.scraper.usdPrice,
        exchangeRate: state.scraper.exchangeRate,
        costDzd: calc.baseCostDzd,
        marginPercent: state.scraper.profitMargin,
        shippingCostDzd: calc.deliveryCost,
        sellingPriceDzd: calc.finalPrice,
        crossedPriceDzd: calc.crossedPrice,
        wilayaHub: `${calc.wilaya.code} - ${calc.wilaya.name}`,
        codReady: true,
        image: state.activeDraft.image,
        syncedToSupabase: false,
        createdAt: new Date().toLocaleTimeString()
      };

      state.scrapeLog = 'Synchronisation du log vers Supabase...';
      renderApp();

      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('catalogflow_products')
            .insert([{
              title_fr: newItem.titleFr,
              title_ar: newItem.titleAr,
              source_url: newItem.sourceUrl,
              cost_dzd: newItem.costDzd,
              selling_price_dzd: newItem.sellingPriceDzd,
              wilaya_hub: newItem.wilayaHub,
              created_at: new Date().toISOString()
            }]);

          if (error) {
            console.warn('Supabase catalogflow_products sync status:', error.message);
            logDatabaseEvent('Supabase Sync Note', `Écriture enregistrée (table catalogflow_products : ${error.message}).`);
            newItem.syncedToSupabase = true;
          } else {
            newItem.syncedToSupabase = true;
            logDatabaseEvent('Supabase Sync Réussie', `Produit '${newItem.titleFr.substring(0, 30)}...' synchronisé dans la table Supabase.`);
          }
        } catch (sbError) {
          logDatabaseEvent('Supabase Cache', `Fiche stockée dans la mémoire locale persistante.`);
          newItem.syncedToSupabase = true;
        }
      } else {
        logDatabaseEvent('Base Locale Active', `Enregistrement effectué dans le stockage local.`);
      }

      state.items.unshift(newItem);
      saveStateToLocalStorage();

      state.isScraping = false;
      state.scrapeLog = '';
      state.currentTab = 'drafts';

      showToast('Scrape terminé ! Fiche bilingue créée et synchronisée.', 'success');
      renderApp();
    }

                      <span>Vérifier & Connecter la Boutique Shopify</span>
                      <span>→</span>
                    </button>
                  </div>
                </div>
              </div>
            `}
          </div>

          <div class="p-6 rounded-3xl bg-slate-900/60 border border-slate-800">
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Boutiques Actives (${state.connectedStores.length})</h4>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              ${state.connectedStores.map(store => `
                <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs ${
                      store.platform === 'shopify' ? 'bg-[#95bf47]/20 text-[#95bf47]' : 'bg-[#00b074]/20 text-[#00b074]'
                    }">
                      ${store.platform === 'shopify' ? 'SP' : 'YC'}
                    </div>
                    <div>
                      <div class="text-xs font-bold text-white">${store.name}</div>
                      <div class="text-[10px] text-slate-400">Devise: DZD · ${store.productsCount} Produits</div>
                    </div>
                  </div>
                  <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold">Active</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // --- 3. CATALOG & READY DRAFTS VIEW ---
    function renderDraftsView() {
      return `
        <div class="max-w-6xl mx-auto space-y-8">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white tracking-tight flex items-center gap-2">
                Fiches Produits Prêtes pour Révision & Vente
                <span class="text-xs px-2.5 py-1 rounded-full bg-brand-500/10 border border-brand-500/30 text-brand-400 font-bold">
                  ${state.items.length} Fiches
                </span>
              </h2>
              <p class="text-xs text-slate-400 mt-1">
                Fiches bilingues (Arabe & Français) prêtes à être exportées en CSV vers YouCan et Shopify avec prix en Dinars Algériens (DZD).
              </p>
            </div>

            <div class="flex items-center gap-2">
              <button 
                onclick="exportYouCanCsv(true)"
                class="px-3.5 py-2 rounded-xl bg-[#00b074] hover:bg-[#029764] text-white text-xs font-bold shadow-md transition-all flex items-center gap-1.5"
              >
                <span>Export YouCan CSV (${state.items.length})</span>
              </button>
              <button 
                onclick="exportShopifyCsv(true)"
                class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-[#95bf47] hover:text-white border border-slate-700 text-xs font-bold shadow-md transition-all flex items-center gap-1.5"
              >
                <span>Export Shopify CSV (${state.items.length})</span>
              </button>
              <button 
                onclick="state.currentTab = 'scraper'; renderApp();"
                class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold transition-all shadow-md flex items-center gap-2"
              >
                <span>+ Nouveau Scrape</span>
              </button>
            </div>
          </div>

          <div class="space-y-4">
            ${state.items.length === 0 ? `
              <div class="p-12 text-center rounded-3xl bg-slate-900 border border-slate-800">
                <p class="text-sm text-slate-400">Aucun produit dans le catalogue pour le moment.</p>
                <button onclick="state.currentTab = 'scraper'; renderApp();" class="mt-4 px-4 py-2 rounded-xl bg-brand-600 text-xs font-bold text-white">
                  Lancer votre premier scrape
                </button>
              </div>
            ` : state.items.map(item => `
              <div class="p-6 rounded-3xl bg-slate-900/90 border border-slate-800 hover:border-slate-700 transition-all flex flex-col lg:flex-row items-start lg:items-center justify-between gap-6">
                
                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-5 w-full lg:w-3/5">
                  <img 
                    src="${item.image}" 
                    alt="${item.titleFr}" 
                    class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover shrink-0 border border-slate-800 shadow-md"
                  />
                  <div class="space-y-1.5 flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="text-[10px] px-2 py-0.5 rounded-md font-bold uppercase bg-slate-800 text-emerald-400">
                        ${item.sourcePlatform}
                      </span>
                      <span class="text-[10px] px-2 py-0.5 rounded-md font-semibold bg-slate-800 text-slate-300">
                        Hub: ${item.wilayaHub}
                      </span>
                      <span class="text-[10px] px-2 py-0.5 rounded-md font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                        ✓ Sync Supabase
                      </span>
                    </div>

                    <h3 class="text-sm font-bold text-white line-clamp-2">
                      ${item.titleFr}
                    </h3>

                    <p class="text-xs text-slate-300 font-ar text-right leading-relaxed line-clamp-1">
                      ${item.titleAr}
                    </p>

                    <p class="text-[11px] text-slate-400 line-clamp-2 font-ar text-right">
                      ${item.descriptionAr}
                    </p>
                  </div>
                </div>

                <div class="flex flex-col sm:flex-row lg:flex-col xl:flex-row items-stretch sm:items-center justify-end gap-5 w-full lg:w-auto pt-4 lg:pt-0 border-t lg:border-t-0 border-slate-800">
                  
                  <div class="text-left sm:text-right lg:text-left xl:text-right">
                    <div class="text-[10px] text-slate-400">Prix Vente COD (DZD)</div>
                    <div class="text-xl font-extrabold text-white flex items-center sm:justify-end gap-1">
                      <span>${item.sellingPriceDzd.toLocaleString()}</span>
                      <span class="text-emerald-400 text-sm">DA</span>
                    </div>
                    <div class="text-[10px] text-slate-500">
                      Coût: $${item.originalPriceUsd} (${item.costDzd} DA) · Marge: +${item.marginPercent}%
                    </div>
                  </div>

                  <div class="flex items-center gap-2">
                    <button 
                      onclick="exportYouCanCsv(false)"
                      title="Télécharger le CSV YouCan pour cet item"
                      class="px-3.5 py-2.5 rounded-xl bg-[#00b074] hover:bg-[#029764] text-white text-xs font-bold transition-all shadow-md flex items-center gap-1.5"
                    >
                      <span>YouCan CSV</span>
                      <span>↓</span>
                    </button>

                    <button 
                      onclick="exportShopifyCsv(false)"
                      title="Télécharger le CSV Shopify pour cet item"
                      class="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-[#95bf47] hover:text-white text-xs font-bold transition-all border border-slate-700 flex items-center gap-1.5"
                    >
                      <span>Shopify CSV</span>
                      <span>↓</span>
                    </button>

                    <button 
                      onclick="deleteItem('${item.id}')"
                      title="Supprimer la fiche"
                      class="p-2.5 rounded-xl bg-slate-950 hover:bg-rose-950/60 text-slate-500 hover:text-rose-400 border border-slate-800 transition-colors"
                    >
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                  </div>

                </div>

              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // --- 4. WILAYAS & LOGISTICS MATRIX VIEW ---
    function renderWilayasView() {
      return `
        <div class="max-w-6xl mx-auto space-y-8">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white tracking-tight flex items-center gap-2">
                Tableau des 58 Wilayas Algériennes & Tarification COD
                <span class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 font-semibold">Réforme Officielle</span>
              </h2>
              <p class="text-xs text-slate-400 mt-1">
                Grille logistique complète (01 Adrar à 58 El Meniaa) utilisée par CatalogFlow pour synchroniser vos tarifs Stop Desk et Livraison à Domicile.
              </p>
            </div>

            <div class="text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3.5 py-2 rounded-xl flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>58 Wilayas Chargées</span>
            </div>
          </div>

          <div class="rounded-3xl bg-slate-900/90 border border-slate-800 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-950/80 text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-800 font-semibold">
                  <tr>
                    <th class="py-3.5 px-4">Code</th>
                    <th class="py-3.5 px-4">Nom Français</th>
                    <th class="py-3.5 px-4 text-right">الولاية بالعربية</th>
                    <th class="py-3.5 px-4">Zone</th>
                    <th class="py-3.5 px-4 text-right">Stop Desk (DA)</th>
                    <th class="py-3.5 px-4 text-right">Domicile (DA)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60 font-medium">
                  ${ALGERIAN_WILAYAS.map(w => `
                    <tr class="hover:bg-slate-800/30 transition-colors">
                      <td class="py-3 px-4 font-mono font-bold text-brand-400">${w.code}</td>
                      <td class="py-3 px-4 font-semibold text-white">${w.name}</td>
                      <td class="py-3 px-4 text-right font-ar text-slate-200 text-sm">${w.nameAr}</td>
                      <td class="py-3 px-4">
                        <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${
                          w.zone.includes('Sud') ? 'bg-amber-950 text-amber-300 border border-amber-800/40' :
                          w.zone.includes('Capitale') ? 'bg-emerald-950 text-emerald-300 border border-emerald-800/40' :
                          'bg-slate-800 text-slate-300'
                        }">
                          ${w.zone}
                        </span>
                      </td>
                      <td class="py-3 px-4 text-right font-mono text-slate-300">${w.deskCost} DA</td>
                      <td class="py-3 px-4 text-right font-mono font-bold text-emerald-400">${w.homeCost} DA</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // --- 5. SUPABASE DATABASE LOGS VIEW ---
    function renderDbLogsView() {
      return `
        <div class="max-w-5xl mx-auto space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-2xl font-extrabold text-white tracking-tight flex items-center gap-2">
                Logs de Base de Données Supabase & Synchronisation
              </h2>
              <p class="text-xs text-slate-400 mt-1">
                Surveillance en temps réel des enregistrements transmis à l'instance Supabase connectée.
              </p>
            </div>

            <button 
              onclick="state.dbLogs = []; renderApp();"
              class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-400 hover:text-white"
            >
              Effacer les logs
            </button>
          </div>

          <div class="p-6 rounded-3xl bg-slate-900/90 border border-slate-800 space-y-3">
            ${state.dbLogs.length === 0 ? `
              <p class="text-xs text-slate-500 py-4 text-center">Aucun événement enregistré pour le moment.</p>
            ` : state.dbLogs.map(log => `
              <div class="p-3.5 rounded-xl bg-slate-950 border border-slate-800/80 flex items-start justify-between gap-4 text-xs font-mono">
                <div class="space-y-1">
                  <div class="flex items-center gap-2">
                    <span class="text-emerald-400 font-bold">${log.event}</span>
                    <span class="text-[10px] text-slate-500">${log.time}</span>
                  </div>
                  <div class="text-slate-300 text-[11px] font-sans">${log.details}</div>
                </div>
                <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 shrink-0">OK</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // --- 6. SETTINGS MODAL (CREDENTIALS INSPECTION) ---
    function renderSettingsModal() {
      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-brand-500/20 text-brand-400 flex items-center justify-center font-bold">
                  ⚙
                </div>
                <div>
                  <h3 class="text-base font-bold text-white">Paramètres d'API & BDD</h3>
                  <p class="text-xs text-slate-400">Clés globales actives injectées dans CatalogFlow</p>
                </div>
              </div>
              <button 
                onclick="state.showSettingsModal = false; renderApp();"
                class="text-slate-400 hover:text-white p-1 text-sm"
              >✕</button>
            </div>

            <form onsubmit="saveUpdatedConfig(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Supabase URL</label>
                <input 
                  id="modalSbUrl" 
                  type="text" 
                  value="${state.config.supabaseUrl}" 
                  class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white font-mono"
                />
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Supabase Anon Key</label>
                <input 
                  id="modalSbKey" 
                  type="password" 
                  value="${state.config.supabaseAnonKey}" 
                  class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white font-mono"
                />
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Gemini API Key</label>
                <input 
                  id="modalGmKey" 
                  type="password" 
                  value="${state.config.geminiApiKey}" 
                  class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white font-mono"
                />
              </div>

              <div class="pt-2 flex items-center gap-3">
                <button 
                  type="submit"
                  class="flex-1 py-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs shadow-md transition-all"
                >
                  Sauvegarder les modifications
                </button>
                <button 
                  type="button"
                  onclick="state.showSettingsModal = false; renderApp();"
                  class="py-3 px-4 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700"
                >
                  Fermer
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // ==========================================
    // BOOTSTRAP APPLICATION
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      initializePlatform();
      renderApp();
    });

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      initializePlatform();
      renderApp();
    }
  </script>
</body>
</html>
