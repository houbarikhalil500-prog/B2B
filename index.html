    // ==========================================
    // TOAST SYSTEM
    // ==========================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium border backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${
        type === 'success' 
          ? 'bg-emerald-950/90 text-emerald-200 border-emerald-500/40 shadow-emerald-950/50' 
          : type === 'warning'
          ? 'bg-amber-950/90 text-amber-200 border-amber-500/40 shadow-amber-950/50'
          : 'bg-rose-950/90 text-rose-200 border-rose-500/40 shadow-rose-950/50'
      }`;

      const icon = type === 'success' ? '✓' : type === 'warning' ? '⚠' : '✕';
      toast.innerHTML = `
        <span class="flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold ${
          type === 'success' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'
        }">${icon}</span>
        <span>${message}</span>
      `;

      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      });

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function calculateEstimatedDzd(usd, rate, marginPct, wilayaCode, deliveryType, packagingCost) {
      const wilaya = ALGERIAN_WILAYAS.find(w => w.code === wilayaCode) || ALGERIAN_WILAYAS[15];
      const deliveryFee = wilaya[deliveryType] || 500;
      const baseCostDzd = Math.round(usd * rate);
      const grossSellingPrice = Math.round(baseCostDzd * (1 + marginPct / 100));
      const totalSuggestedDzd = grossSellingPrice + deliveryFee + packagingCost;
      const roundedDzd = Math.ceil(totalSuggestedDzd / 50) * 50;

      return {
        baseCostDzd,
        grossSellingPrice,
        deliveryFee,
        totalSuggestedDzd: roundedDzd,
        wilaya
      };
    }

    function setRatePreset(type) {
      state.scraperForm.rateType = type;
      if (type === 'parallel') {
        state.scraperForm.exchangeRate = state.currentUser.marketRate;
      } else if (type === 'official') {
        state.scraperForm.exchangeRate = state.currentUser.officialRate;
      }
      renderApp();
    }

        const margin = state.scraperForm.profitMargin;
        const wilaya = state.scraperForm.targetWilaya;
        const deliveryType = state.scraperForm.deliveryType;
        const packaging = state.scraperForm.includePackaging;

        const calc = calculateEstimatedDzd(usd, rate, margin, wilaya, deliveryType, packaging);

          titleAr: 'مصباح الطاقة الشمسية الخارجي فائق الإضاءة مع مستشعر الحركة ومقاوم للماء',
          sourceUrl: targetUrl,
          sourcePlatform: targetUrl.includes('aliexpress') ? 'AliExpress' : 'Global Source',
          originalUsd: usd,
          exchangeRate: rate,
          costDzd: calc.baseCostDzd,
          margin: margin,
          shippingDzd: calc.deliveryFee,
          packagingDzd: packaging,
          finalPriceDzd: calc.totalSuggestedDzd,
          originalPriceCrossed: Math.round(calc.totalSuggestedDzd * 1.35),
          status: 'ready',
          wilayaHub: `${calc.wilaya.code} - ${calc.wilaya.name}`,
          codReady: true,
          image: 'https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=400&q=80',
          specs: [
            'Batterie Li-ion 2400mAh intégrée',
            'Portée de détection 5 à 8 mètres',
            'Certification étanche IP65 spécial climat DZ',
            'Télécommande multi-modes incluse'
          ],
          rating: 4.85,
          targetAudience: 'Villas, jardins, cours, sécurité nocturne'
        };

        state.drafts.unshift(newDraft);
        state.isScraping = false;
        state.scrapeStep = '';
        state.currentTab = 'drafts';
        
        showToast('Produit extrait, nettoyé et traduit en DZD avec succès !', 'success');
        renderApp();
      }, 3600);
    }

    function publishDraft(draftId, platform) {
      const draft = state.drafts.find(d => d.id === draftId);
      if (!draft) return;

      const storeName = platform === 'shopify' ? 'Shopify (algeria-tech-store)' : 'YouCan (dz-tendances)';
      showToast(`Publication vers ${storeName} en DZD en cours...`, 'success');
      
      setTimeout(() => {
        draft.status = 'published';
        const store = state.connectedStores.find(s => s.platform === platform);
        if (store) store.productsCount += 1;
        showToast(`Produit synchronisé sur ${platform.toUpperCase()} avec succès ! 🚀`, 'success');
        renderApp();
      }, 800);

                  <span>Suppression automatique des logos & filigranes fournisseurs chinois</span>
                </label>
                <label class="flex items-center gap-2.5 text-xs text-slate-300 cursor-pointer">
                  <input type="checkbox" checked class="w-4 h-4 rounded text-brand-600 focus:ring-0 bg-slate-950 border-slate-700" />
                  <span>Générer double titre : Français E-Com + Arabe Darija optimisé pour le COD</span>
                </label>
              </div>

              <div class="pt-2">
                <button 
                  onclick="triggerAiScrape()"
                  ${state.isScraping ? 'disabled' : ''}
                  class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-brand-600 via-emerald-500 to-teal-400 hover:from-brand-500 hover:to-teal-300 text-white font-extrabold text-sm shadow-xl shadow-brand-600/30 active:scale-[0.99] transition-all flex items-center justify-center gap-2"
                >
                  <span class="text-base">✨</span>
                  <span>Lancer l'IA : Nettoyer, Traduire & Calculer en DZD</span>
                </button>
              </div>

            </div>

            <div class="lg:col-span-5 p-6 rounded-3xl bg-slate-900/90 border border-slate-800 flex flex-col justify-between space-y-6">
              <div>
                <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                  <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Calculateur Financier DZD</span>
                  <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-bold">Simulation en Direct</span>
                </div>

                <div class="space-y-3 text-xs">
                  <div class="flex justify-between items-center text-slate-300">
                    <span>Coût Fournisseur USD :</span>
                    <span class="font-mono font-semibold">$${form.usdPrice.toFixed(2)}</span>
                  </div>
                  <div class="flex justify-between items-center text-slate-300">
                    <span>Taux de Change Appliqué :</span>
                    <span class="font-mono font-semibold text-emerald-400">1$ = ${form.exchangeRate} DA</span>
                  </div>
                  <div class="flex justify-between items-center text-slate-300">
                    <span>Prix de Revient DZD (Base) :</span>
                    <span class="font-mono font-bold text-white">${calc.baseCostDzd.toLocaleString()} DA</span>
                  </div>
                  <div class="flex justify-between items-center text-slate-300">
                    <span>Marge Nette Vendeur (+${form.profitMargin}%) :</span>
                    <span class="font-mono font-bold text-brand-400">+${(calc.grossSellingPrice - calc.baseCostDzd).toLocaleString()} DA</span>
                  </div>
                  <div class="flex justify-between items-center text-slate-300">
                    <span>Livraison Hub (${calc.wilaya.code} - ${calc.wilaya.name}) :</span>
                    <span class="font-mono font-semibold text-slate-200">+${calc.deliveryFee} DA</span>
                  </div>
                  <div class="flex justify-between items-center text-slate-300">
                    <span>Emballage & Pochette Colis :</span>
                    <span class="font-mono font-semibold text-slate-200">+${form.includePackaging} DA</span>
                  </div>
                </div>

                <div class="mt-6 p-4 rounded-2xl bg-gradient-to-br from-emerald-950/60 to-slate-950 border border-emerald-500/40 text-center">
                  <div class="text-[11px] font-medium text-emerald-300 uppercase tracking-wider">Prix de Vente Conseillé au Client Final (COD)</div>
                  <div class="text-3xl font-black text-white mt-1 tracking-tight">
                    ${calc.totalSuggestedDzd.toLocaleString()} <span class="text-emerald-400 text-lg">DZD</span>
                  </div>
                  <div class="text-[11px] text-slate-400 mt-1">
                    Prix barré marketing suggéré : <span class="line-through text-slate-500">${Math.round(calc.totalSuggestedDzd * 1.35).toLocaleString()} DA</span>
                  </div>
                </div>

                <div class="mt-4 p-3 rounded-xl bg-slate-950/80 border border-slate-800 text-[11px] text-slate-400">
                  <span class="text-brand-400 font-bold">Sécurité COD :</span> 
                  Ce montant couvre les retours d'expédition (taux moyen d'échec de 12% en Algérie pris en compte dans le coussin de marge).
                </div>
              </div>

              <div class="pt-4 border-t border-slate-800">
                <button 
                  onclick="switchTab('drafts')"
                  class="w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-white transition-all flex items-center justify-center gap-1.5"
                >
                  <span>Consulter le Tableau des Brouillons (${state.drafts.length})</span>
                  <span>→</span>
                </button>
              </div>

            </div>
          </div>
        </div>
      `;
    }

    // --- 2.4 READY FOR REVIEW (DRAFTS) TAB ---
    function renderDraftsTab() {
      return `
        <div class="max-w-6xl mx-auto space-y-8">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white tracking-tight flex items-center gap-2">
                Fiches Produits Prêtes pour Révision
                <span class="text-xs px-2.5 py-1 rounded-full bg-brand-500/10 border border-brand-500/30 text-brand-400 font-bold">
                  ${state.drafts.length} Fiches Disponibles
                </span>
              </h2>
              <p class="text-xs text-slate-400 mt-1">
                Revoyez le titre bilingue, validez le tarif en Dinars et synchronisez directement vers votre vitrine YouCan ou Shopify.
              </p>
            </div>

            <button 
              onclick="switchTab('scraper')"
              class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold transition-all shadow-md flex items-center gap-2"
            >
              <span>+ Scraper un Nouveau Produit</span>
            </button>
          </div>

          <div class="space-y-4">
            ${state.drafts.map(draft => `
              <div class="p-6 rounded-3xl bg-slate-900/90 border border-slate-800 hover:border-slate-700 transition-all flex flex-col lg:flex-row items-start lg:items-center justify-between gap-6">
                
                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-5 w-full lg:w-3/5">
                  <img 
                    src="${draft.image}" 
                    alt="${draft.titleFr}" 
                    class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover shrink-0 border border-slate-800"
                  />
                  <div class="space-y-1.5 flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="text-[10px] px-2 py-0.5 rounded-md font-bold uppercase bg-slate-800 text-emerald-400">
                        ${draft.sourcePlatform}
                      </span>
                      <span class="text-[10px] px-2 py-0.5 rounded-md font-semibold bg-slate-800 text-slate-300">
                        Hub: ${draft.wilayaHub}
                      </span>
                      ${draft.status === 'published' ? `
                        <span class="text-[10px] px-2 py-0.5 rounded-md font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                          ✓ En Ligne sur la Boutique
                        </span>
                      ` : `
                        <span class="text-[10px] px-2 py-0.5 rounded-md font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
                          Prêt pour publication
                        </span>
                      `}
                    </div>

                    <h3 class="text-sm font-bold text-white line-clamp-2">
                      ${draft.titleFr}
                    </h3>

                    <p class="text-xs text-slate-300 font-ar text-right leading-relaxed line-clamp-1">
                      ${draft.titleAr}
                    </p>

                    <div class="flex items-center gap-1.5 flex-wrap pt-1">
                      ${draft.specs.slice(0, 3).map(s => `
                        <span class="text-[10px] px-2 py-0.5 rounded-md bg-slate-950 text-slate-400 border border-slate-800/80">
                          ${s}
                        </span>
                      `).join('')}
                    </div>
                  </div>
                </div>

                <div class="flex flex-col sm:flex-row lg:flex-col xl:flex-row items-stretch sm:items-center justify-end gap-5 w-full lg:w-auto pt-4 lg:pt-0 border-t lg:border-t-0 border-slate-800">
                  
                  <div class="text-left sm:text-right lg:text-left xl:text-right">
                    <div class="text-[10px] text-slate-400">Prix de Vente COD (DZD)</div>
                    <div class="text-xl font-extrabold text-white flex items-center sm:justify-end gap-1">
                      <span>${draft.finalPriceDzd.toLocaleString()}</span>
                      <span class="text-emerald-400 text-sm">DA</span>
                    </div>
                    <div class="text-[10px] text-slate-500">
                      Coût: $${draft.originalUsd} (${draft.costDzd} DA) · Marge: +${draft.margin}%
                    </div>
                  </div>

                  <div class="flex items-center gap-2">
                    <button 
                      onclick="publishDraft('${draft.id}', 'youcan')"
                      title="Publier sur YouCan"
                      class="px-3.5 py-2.5 rounded-xl bg-[#00b074] hover:bg-[#029764] text-white text-xs font-bold transition-all shadow-md flex items-center gap-1.5"
                    >
                      <span>YouCan</span>
                      <span>↑</span>
                    </button>

                    <button 
                      onclick="publishDraft('${draft.id}', 'shopify')"
                      title="Publier sur Shopify"
                      class="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-[#95bf47] hover:text-white text-xs font-bold transition-all border border-slate-700 flex items-center gap-1.5"
                    >
                      <span>Shopify</span>
                      <span>↑</span>
                    </button>

                    <button 
                      onclick="deleteDraft('${draft.id}')"
                      title="Supprimer la fiche"
                      class="p-2.5 rounded-xl bg-slate-950 hover:bg-rose-950/60 text-slate-500 hover:text-rose-400 border border-slate-800 transition-colors"
                    >
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                  </div>

                </div>

              </div>
            `).join('')}
          </div>

        </div>
      `;
    }

    // --- 2.5 WILAYAS & LOGISTICS MATRIX TAB ---
    function renderWilayasTab() {
      return `
        <div class="max-w-6xl mx-auto space-y-8">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white tracking-tight flex items-center gap-2">
                Grille des 58 Wilayas Algériennes & Tarifs de Livraison
                <span class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 font-semibold">Réforme Administrative 2024</span>
              </h2>
              <p class="text-xs text-slate-400 mt-1">
                Tableau complet intégrant les codes Wilaya (01 à 58), les zones géographiques et les coûts standard de livraison Stop Desk & Domicile pour vos fiches CatalogFlow.
              </p>
            </div>

            <div class="text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3.5 py-2 rounded-xl flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>58 Wilayas Synchronisées</span>
            </div>
          </div>

          <div class="rounded-3xl bg-slate-900/90 border border-slate-800 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-950/80 text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-800 font-semibold">
                  <tr>
                    <th class="py-3.5 px-4">Code</th>
                    <th class="py-3.5 px-4">Nom Français</th>
                    <th class="py-3.5 px-4 text-right">الولاية بالعربية</th>
                    <th class="py-3.5 px-4">Zone</th>
                    <th class="py-3.5 px-4 text-right">Stop Desk (DA)</th>
                    <th class="py-3.5 px-4 text-right">Domicile (DA)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60 font-medium">
                  ${ALGERIAN_WILAYAS.map(w => `
                    <tr class="hover:bg-slate-800/30 transition-colors">
                      <td class="py-3 px-4 font-mono font-bold text-brand-400">${w.code}</td>
                      <td class="py-3 px-4 font-semibold text-white">${w.name}</td>
                      <td class="py-3 px-4 text-right font-ar text-slate-200 text-sm">${w.nameAr}</td>
                      <td class="py-3 px-4">
                        <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${
                          w.zone.includes('Sud') ? 'bg-amber-950 text-amber-300 border border-amber-800/40' :
                          w.zone.includes('Capitale') ? 'bg-emerald-950 text-emerald-300 border border-emerald-800/40' :
                          'bg-slate-800 text-slate-300'
                        }">
                          ${w.zone}
                        </span>
                      </td>
                      <td class="py-3 px-4 text-right font-mono text-slate-300">${w.deskCost} DA</td>
                      <td class="py-3 px-4 text-right font-mono font-bold text-emerald-400">${w.homeCost} DA</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // INITIAL BOOTSTRAP
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      renderApp();
    }
  </script>
</body>
</html>
